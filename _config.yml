title: T20 2026 Prediction Contest
email: your-email@example.com
description: Predict the outcomes of major sporting events
author: Ram Narasimhan
baseurl: "/prediction-contests"
url: "https://ram-n.github.io"

# Active Contest Configuration
contest:
  slug: "t20-2026"
  name: "T20 2026"
  full_title: "T20 World Cup 2026 Prediction Contest"
  background: "/img/bg_t20.webp"
  entry_form: "https://forms.gle/JmsZVXwQ83SAojv97"
  # T20 background images for blog posts (will cycle through automatically)
  t20_backgrounds:
    - "/img/bg_t20.webp"
    - "/img/bg_t20_1.jpg"
    - "/img/bg_t20_2.jpg"

# Social Profiles

# Add your google-analytics ID here to activate google analytics
#google_analytics: UA-XXXXXXXXX-X # out your google-analytics code

# Build settings
markdown: kramdown
paginate: 5
paginate_path: "/posts/page:num/"
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap ## Uncomment this line to silently generate a sitemaps.org compliant sitemap for your Jekyll site

# Exclude templates and bin directories from build
exclude:
  - templates/
  - bin/
  - data/
